# Twenty CRM 演示 RBAC。同一套权限模型与 demo 身份（孙七 sales_rep / 王五 sales_manager）
# 与后端解耦：CRM 域换适配器（本项目从早期后端迁到 Twenty）不改这份规则。
# 这正是「守卫与后端无关」的配置层证据。
roles:
  sales_rep:
    tools:
      [
        list_accounts,
        get_account,
        list_contacts,
        get_contact,
        list_opportunities,
        get_opportunity,
        create_contact,
        update_contact,
        delete_contact,
        update_opportunity_stage,
        issue_refund,
      ]
    rows:
      - field: owner_id
        equals: $self.userId
    mask: [phone]
    # 改/删/改阶段：一律涉审。退款：分级放行（policy-as-code）——
    # 金额 > 500 或本月已退 ≥ 2 笔（这是第 3 笔起）即需经理批，否则小额自动放行。
    approval:
      - update_contact
      - delete_contact
      - update_opportunity_stage
      - tool: issue_refund
        when:
          anyOf:
            - { field: amount, gt: 500 }
            - { field: refundCountThisMonth, gte: 2 }
  sales_manager:
    tools: "*"
    approver: true
