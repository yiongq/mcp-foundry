# Twenty CRM 演示 RBAC。同一套权限模型与 demo 身份（林哲 sales_rep / 何静 sales_manager）
# 与后端解耦：CRM 域换适配器（本项目从早期后端迁到 Twenty）不改这份规则。
# 这正是「守卫与后端无关」的配置层证据。
roles:
  sales_rep:
    tools:
      [
        list_accounts,
        get_account,
        list_contacts,
        get_contact,
        list_opportunities,
        get_opportunity,
        create_contact,
        update_contact,
        delete_contact,
        update_opportunity_stage,
        issue_refund,
      ]
    rows:
      - field: owner_id
        equals: $self.userId
    mask: [phone]
    # 改/删/改阶段：一律涉审。退款：分级放行（policy-as-code）——
    # 金额 > 500 或本月已退 ≥ 2 笔（这是第 3 笔起）即需经理批，否则小额自动放行。
    approval:
      - update_contact
      - delete_contact
      - update_opportunity_stage
      - tool: issue_refund
        when:
          anyOf:
            - { field: amount, gt: 500 }
            - { field: refundCountThisMonth, gte: 2 }
  sales_manager:
    tools: "*"
    approver: true
  # 只读经理：给公开演示页的「切换身份」用。工具面比销售宽（多 get_pipeline_summary、
  # 无 owner_id 行级过滤 → 跨销售可见、无 phone 脱敏），但**不含任何写工具、非 approver**——
  # 任何访客切到此身份也无法改数据/自批，不违背「发起人无法自批」与 DEPLOY-CHECKLIST
  # 「审批人令牌不放前端」。这演示的是「同一网关、身份变宽 → 读的面变宽」，不放开写。
  sales_manager_ro:
    tools:
      [
        list_accounts,
        get_account,
        list_contacts,
        get_contact,
        list_opportunities,
        get_opportunity,
        get_pipeline_summary,
      ]
