# EspoCRM 演示 RBAC。角色按域独立命名——RBAC 按系统分治，HR 域的
# employee/hr_admin 在本域不存在（unknown_role），通配角色的权力边界止步于本域。
# 演示身份：孙七 = {userId: e007, role: sales_rep}；王五 = {userId: e005, role: sales_manager}。
# rows 的 field 对齐适配器统一行结构里的 snake_case 字段名（owner_id）。
# mask [phone]：客户电话统一走系统外呼、销售个人不可见（防离职带走客户）；
# email 留明文——公司域名邮箱本身可审计。
# approval：销售代表的改/删/改阶段须经人工审批（创建免审——风险梯度：新增可回收，
# 改删不可逆）。approver: 经理角色可批复本域审批单（飞书卡片按钮 / POST /approvals）。
roles:
  sales_rep:
    tools:
      [
        list_accounts,
        get_account,
        list_contacts,
        get_contact,
        list_opportunities,
        get_opportunity,
        create_contact,
        update_contact,
        delete_contact,
        update_opportunity_stage,
      ]
    rows:
      - field: owner_id
        equals: $self.userId
    mask: [phone]
    approval: [update_contact, delete_contact, update_opportunity_stage]
  sales_manager:
    tools: "*"
    approver: true
