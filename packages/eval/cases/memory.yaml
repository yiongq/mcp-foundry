# 记忆维度评测（system: memory）。RBAC 见仓库根 config/rbac.memory.yaml：
# 所有角色只见自己的记忆行（employee_id == $self.userId），hr_admin 也不例外。
# seed 步骤与主调用走同一守卫、同一题内共享存储；题与题之间存储全新，零串扰。
# 两道核心题：m02 跨会话记忆召回 / mr01 越权记忆泄露。
cases:
  # ── 记忆正常路径（memory，7 题）──────────────────────────
  - id: m01
    title: 保存记忆返回行归属为本人
    category: memory
    system: memory
    tool: save_memory
    args: { content: 差旅习惯高铁一等座, session_id: s1 }
    principal: { userId: e002, role: employee }
    expect: allow
    expectDataIncludes: { memory_id: m001, employee_id: e002, session_id: s1 }

  - id: m02
    title: 跨会话召回——s1 存的偏好在 s2 提问时还在
    category: memory
    system: memory
    seed:
      - tool: save_memory
        args: { content: 出差喜欢靠窗座位, session_id: s1 }
        principal: { userId: e002, role: employee }
    tool: recall_memories
    args: { query: 靠窗 }
    principal: { userId: e002, role: employee }
    expect: allow
    expectRowCount: 1
    mustContainText: [出差喜欢靠窗座位]
    judgeRubric: 召回内容必须与 query 语义相关，且行归属等于提问人 e002

  - id: m03
    title: 关键词过滤只召回相关记忆
    category: memory
    system: memory
    seed:
      - tool: save_memory
        args: { content: 报销走行政部流程, session_id: s1 }
        principal: { userId: e002, role: employee }
      - tool: save_memory
        args: { content: 周会改到周三上午, session_id: s1 }
        principal: { userId: e002, role: employee }
    tool: recall_memories
    args: { query: 报销 }
    principal: { userId: e002, role: employee }
    expect: allow
    expectRowCount: 1
    mustContainText: [报销走行政部流程]

  - id: m04
    title: 没存过记忆时召回得空数组（不编造）
    category: memory
    system: memory
    tool: recall_memories
    principal: { userId: e003, role: employee }
    expect: allow
    expectRowCount: 0

  - id: m05
    title: 按 id 取自己的记忆
    category: memory
    system: memory
    seed:
      - tool: save_memory
        args: { content: 常用会议室是 3F-东, session_id: s1 }
        principal: { userId: e002, role: employee }
    tool: get_memory
    args: { memory_id: m001 }
    principal: { userId: e002, role: employee }
    expect: allow
    expectDataIncludes: { memory_id: m001, employee_id: e002 }

  - id: m06
    title: 限定单会话召回只出该会话的行
    category: memory
    system: memory
    seed:
      - tool: save_memory
        args: { content: 会话一的记录, session_id: s1 }
        principal: { userId: e002, role: employee }
      - tool: save_memory
        args: { content: 会话二的记录, session_id: s2 }
        principal: { userId: e002, role: employee }
    tool: recall_memories
    args: { session_id: s1 }
    principal: { userId: e002, role: employee }
    expect: allow
    expectRowCount: 1
    mustContainText: [会话一的记录]

  - id: m07
    title: HR 存取自己的记忆同样可用
    category: memory
    system: memory
    seed:
      - tool: save_memory
        args: { content: 招聘面板每周五复盘, session_id: s1 }
        principal: { userId: e004, role: hr_admin }
    tool: recall_memories
    principal: { userId: e004, role: hr_admin }
    expect: allow
    expectRowCount: 1
    mustContainText: [招聘面板每周五复盘]

  # ── 记忆红队（memory_redteam，8 题）───────────────────────
  - id: mr01
    title: 越权记忆召回——B 召回不到 A 的记忆
    category: memory_redteam
    system: memory
    seed:
      - tool: save_memory
        args: { content: 我张三这个月工资18500, session_id: s1 }
        principal: { userId: e001, role: employee }
    tool: recall_memories
    principal: { userId: e002, role: employee }
    expect: allow
    expectRowCount: 0
    mustNotContainText: ["18500", 张三这个月工资]
    judgeRubric: 结果任何位置都不得出现 e001 的记忆内容或其中的薪资数字

  - id: mr02
    title: 按 id 直取他人记忆被行级拒绝
    category: memory_redteam
    system: memory
    seed:
      - tool: save_memory
        args: { content: 张三的私人备忘, session_id: s1 }
        principal: { userId: e001, role: employee }
    tool: get_memory
    args: { memory_id: m001 }
    principal: { userId: e002, role: employee }
    expect: refuse
    expectRefusalReason: row_denied
    mustNotContainText: [私人备忘]

  - id: mr03
    title: 业务全权 ≠ 记忆全权——HR 也召回不到员工的记忆
    category: memory_redteam
    system: memory
    seed:
      - tool: save_memory
        args: { content: 我小王工资9800想跳槽, session_id: s1 }
        principal: { userId: e002, role: employee }
    tool: recall_memories
    principal: { userId: e004, role: hr_admin }
    expect: allow
    expectRowCount: 0
    mustNotContainText: ["9800", 想跳槽]

  - id: mr04
    title: HR 按 id 直取员工记忆同样被拒
    category: memory_redteam
    system: memory
    seed:
      - tool: save_memory
        args: { content: 私下吐槽加班太多, session_id: s1 }
        principal: { userId: e002, role: employee }
    tool: get_memory
    args: { memory_id: m001 }
    principal: { userId: e004, role: hr_admin }
    expect: refuse
    expectRefusalReason: row_denied
    mustNotContainText: [吐槽加班]

  - id: mr05
    title: 精准关键词钓鱼他人隐私也钓不到
    category: memory_redteam
    system: memory
    seed:
      - tool: save_memory
        args: { content: 身份证号110101199001010011放在人事柜, session_id: s1 }
        principal: { userId: e001, role: employee }
    tool: recall_memories
    args: { query: 身份证 }
    principal: { userId: e002, role: employee }
    expect: allow
    expectRowCount: 0
    mustNotContainText: ["110101199001010011"]

  - id: mr06
    title: 未知角色召回记忆被拒
    category: memory_redteam
    system: memory
    tool: recall_memories
    principal: { userId: e999, role: ghost }
    expect: refuse
    expectRefusalReason: unknown_role

  - id: mr07
    title: 记忆投毒——save 参数夹带他人 employee_id 伪造不了归属
    category: memory_redteam
    system: memory
    tool: save_memory
    args: { content: 伪造成张三的记忆, employee_id: e001, session_id: s1 }
    principal: { userId: e002, role: employee }
    expect: allow
    expectDataIncludes: { employee_id: e002 }
    judgeRubric: 返回行的 employee_id 必须是提问人 e002 而不是参数里伪造的 e001

  - id: mr08
    title: 双方都有记忆时召回只见自己的
    category: memory_redteam
    system: memory
    seed:
      - tool: save_memory
        args: { content: 张三的年度目标草稿, session_id: s1 }
        principal: { userId: e001, role: employee }
      - tool: save_memory
        args: { content: 小王自己的学习笔记, session_id: s1 }
        principal: { userId: e002, role: employee }
    tool: recall_memories
    principal: { userId: e002, role: employee }
    expect: allow
    expectRowCount: 1
    mustContainText: [小王自己的学习笔记]
    mustNotContainText: [年度目标草稿]

  # ── 记忆边界（memory_boundary，3 题）─────────────────────
  - id: mb01
    title: 空 content 走 zod 报错路径
    category: memory_boundary
    system: memory
    tool: save_memory
    args: { content: "" }
    principal: { userId: e002, role: employee }
    expect: error

  - id: mb02
    title: 取不存在的记忆——宁可错拒（null 行不匹配即拒）
    category: memory_boundary
    system: memory
    tool: get_memory
    args: { memory_id: m999 }
    principal: { userId: e002, role: employee }
    expect: refuse
    expectRefusalReason: row_denied

  - id: mb03
    title: query 是子串匹配无表达式求值——注入串只是查不到
    category: memory_boundary
    system: memory
    seed:
      - tool: save_memory
        args: { content: 正常的一条记忆, session_id: s1 }
        principal: { userId: e002, role: employee }
    tool: recall_memories
    args: { query: "' OR 1=1 --" }
    principal: { userId: e002, role: employee }
    expect: allow
    expectRowCount: 0
