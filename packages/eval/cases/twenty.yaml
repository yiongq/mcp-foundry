# Twenty CRM 评测用例（硬断言轨）。fixture 与角色对齐共享契约：
#   sales_rep:     tools [list_accounts, get_account, list_contacts, get_contact, list_opportunities, get_opportunity]
#                  rows [{field: owner_id, equals: $self.userId}]，mask [phone]
#   sales_manager: tools "*"
# 演示身份：孙七 = e007/sales_rep；周八 = e008/sales_rep；王五 = e005/sales_manager。
# 与 HR 域同一套方法学：工具白名单 / 行级过滤 / 字段脱敏 / 拒答形状 各维度都有题，
# 另加跨域题（cr08/cr09）：HR 域角色进 CRM 域是未知角色——通配权力不跨域。
# CI 门禁：expect 为 refuse/error 的题任一失败 → 退出码 1。
cases:
  # ── 正常查询（crm，11 题）────────────────────────────────
  - id: cn01
    title: 销售查自己的商机（金额钉死 fixture）
    category: crm
    system: twenty
    tool: get_opportunity
    args: { opportunity_id: o001 }
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectDataIncludes:
      { opportunity_id: o001, name: 华胜产线扩建设备采购, stage: Proposal, amount: 480000, currency: CNY }

  - id: cn02
    title: 销售拉客户列表只见自己名下 3 家
    category: crm
    system: twenty
    tool: list_accounts
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectRowCount: 3
    mustNotContainFields: [phone]

  - id: cn03
    title: 销售查自己客户的详情（phone 应被脱敏）
    category: crm
    system: twenty
    tool: get_account
    args: { account_id: a001 }
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectDataIncludes: { account_id: a001, name: 华胜精密制造, industry: 制造业, city: 苏州 }
    mustNotContainFields: [phone]
    mustNotContainText: ["0512-88001001"]

  - id: cn04
    title: 销售查自己客户的联系人——email 可见、phone 脱敏
    category: crm
    system: twenty
    tool: get_contact
    args: { contact_id: c001 }
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectDataIncludes:
      { contact_id: c001, name: 陈建国, title: 采购总监, email: chenjianguo@huasheng.example.com }
    mustNotContainFields: [phone]
    mustNotContainText: ["13900001001"]

  - id: cn05
    title: 销售拉商机列表只见自己的 3 单
    category: crm
    system: twenty
    tool: list_opportunities
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectRowCount: 3

  - id: cn06
    title: 经理查任意销售的商机（数值钉死 fixture）
    category: crm
    system: twenty
    tool: get_opportunity
    args: { opportunity_id: o003 }
    principal: { userId: e005, role: sales_manager }
    expect: allow
    expectDataIncludes:
      { opportunity_id: o003, name: 启明平台私有化部署, stage: Closed Won, amount: 150000, owner_id: e008 }

  - id: cn07
    title: 经理看全员业绩盘——两位销售各一行、金额完整
    category: crm
    system: twenty
    tool: get_pipeline_summary
    principal: { userId: e005, role: sales_manager }
    expect: allow
    expectRowCount: 2
    mustContainText: ["孙七", "周八", "1465000", "150000"]

  - id: cn08
    title: 经理拉全部客户共 5 家
    category: crm
    system: twenty
    tool: list_accounts
    principal: { userId: e005, role: sales_manager }
    expect: allow
    expectRowCount: 5

  - id: cn09
    title: 经理按阶段筛 Proposal 得 2 单
    category: crm
    system: twenty
    tool: list_opportunities
    args: { stage: Proposal }
    principal: { userId: e005, role: sales_manager }
    expect: allow
    expectRowCount: 2

  - id: cn10
    title: 经理查联系人 phone 明文可见
    category: crm
    system: twenty
    tool: get_contact
    args: { contact_id: c003 }
    principal: { userId: e005, role: sales_manager }
    expect: allow
    expectDataIncludes: { contact_id: c003, name: 周涛, phone: "13900001003" }

  - id: cn11
    title: 列表行数据面最小化——客户列表行不带 phone/website/email
    category: crm
    system: twenty
    tool: list_accounts
    principal: { userId: e005, role: sales_manager }
    expect: allow
    expectRowCount: 5
    mustNotContainFields: [phone, website, email]

  # ── 越权红队（crm_redteam，11 题）────────────────────────
  - id: cr01
    title: 销售清点全员业绩盘（工具白名单收口）
    category: crm_redteam
    system: twenty
    tool: get_pipeline_summary
    principal: { userId: e007, role: sales_rep }
    expect: refuse
    expectRefusalReason: tool_not_allowed
    mustNotContainText: ["1465000", "150000"]

  - id: cr02
    title: 销售查同事的商机金额
    category: crm_redteam
    system: twenty
    tool: get_opportunity
    args: { opportunity_id: o003 }
    principal: { userId: e007, role: sales_rep }
    expect: refuse
    expectRefusalReason: row_denied
    mustNotContainText: ["150000", "启明平台私有化部署"]

  - id: cr03
    title: 销售查同事名下的客户
    category: crm_redteam
    system: twenty
    tool: get_account
    args: { account_id: a003 }
    principal: { userId: e007, role: sales_rep }
    expect: refuse
    expectRefusalReason: row_denied

  - id: cr04
    title: 销售挖同事客户的联系人
    category: crm_redteam
    system: twenty
    tool: get_contact
    args: { contact_id: c003 }
    principal: { userId: e007, role: sales_rep }
    expect: refuse
    expectRefusalReason: row_denied
    mustNotContainText: ["13900001003", "zhoutao@qiming.example.com"]

  - id: cr05
    title: 销售扫全表商机也只见自己的（周八 2 单）
    category: crm_redteam
    system: twenty
    tool: list_opportunities
    principal: { userId: e008, role: sales_rep }
    expect: allow
    expectRowCount: 2
    mustNotContainText: ["480000", "720000"]

  - id: cr06
    title: 销售按行业扫别人的客户拿不到任何行
    category: crm_redteam
    system: twenty
    tool: list_accounts
    args: { industry: 软件 }
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectRowCount: 0

  - id: cr07
    title: 未知角色 ghost 拉客户列表
    category: crm_redteam
    system: twenty
    tool: list_accounts
    principal: { userId: e999, role: ghost }
    expect: refuse
    expectRefusalReason: unknown_role

  - id: cr08
    title: HR 域角色进 CRM 域——employee 是未知角色
    category: crm_redteam
    system: twenty
    tool: list_accounts
    principal: { userId: e002, role: employee }
    expect: refuse
    expectRefusalReason: unknown_role

  - id: cr09
    title: HR 通配角色跨域清点业绩盘——业务全权 ≠ 跨域全权
    category: crm_redteam
    system: twenty
    tool: get_pipeline_summary
    principal: { userId: e004, role: hr_admin }
    expect: refuse
    expectRefusalReason: unknown_role
    mustNotContainText: ["1465000"]

  - id: cr10
    title: 角色名大小写伪造 Sales_Rep 不被认账
    category: crm_redteam
    system: twenty
    tool: get_account
    args: { account_id: a001 }
    principal: { userId: e007, role: Sales_Rep }
    expect: refuse
    expectRefusalReason: unknown_role

  - id: cr11
    title: opportunity_id 大小写变造 O001——查无此单按行级错拒，不做模糊匹配
    category: crm_redteam
    system: twenty
    tool: get_opportunity
    args: { opportunity_id: O001 }
    principal: { userId: e007, role: sales_rep }
    expect: refuse
    expectRefusalReason: row_denied

  # ── 边界（crm_boundary，6 题）────────────────────────────
  - id: cb01
    title: 经理查不存在的客户得 null（不报错不编造）
    category: crm_boundary
    system: twenty
    tool: get_account
    args: { account_id: a999 }
    principal: { userId: e005, role: sales_manager }
    expect: allow

  - id: cb02
    title: 空参数走 zod 报错路径
    category: crm_boundary
    system: twenty
    tool: get_account
    args: {}
    principal: { userId: e005, role: sales_manager }
    expect: error

  - id: cb03
    title: opportunity_id 传成数字类型 → zod 报错
    category: crm_boundary
    system: twenty
    tool: get_opportunity
    args: { opportunity_id: 123 }
    principal: { userId: e005, role: sales_manager }
    expect: error

  - id: cb04
    title: 调用不存在的工具（通配角色也只能撞到适配器报错）
    category: crm_boundary
    system: twenty
    tool: delete_account
    principal: { userId: e005, role: sales_manager }
    expect: error

  - id: cb05
    title: 销售查不存在的商机——宁可错拒（null 行不匹配即拒）
    category: crm_boundary
    system: twenty
    tool: get_opportunity
    args: { opportunity_id: o999 }
    principal: { userId: e007, role: sales_rep }
    expect: refuse
    expectRefusalReason: row_denied

  - id: cb06
    title: industry 传空字符串 → zod min(1) 报错
    category: crm_boundary
    system: twenty
    tool: list_accounts
    args: { industry: "" }
    principal: { userId: e005, role: sales_manager }
    expect: error

  # ── list_contacts（2026-07-17 补，真机复验发现的检索缺口）──
  - id: cn12
    title: 经理拉全部联系人 5 行——列表行数据面最小化，不带 email/phone
    category: crm
    system: twenty
    tool: list_contacts
    principal: { userId: e005, role: sales_manager }
    expect: allow
    expectRowCount: 5
    mustNotContainFields: [email, phone]

  - id: cn13
    title: 经理按客户过滤联系人
    category: crm
    system: twenty
    tool: list_contacts
    args: { account_id: a001 }
    principal: { userId: e005, role: sales_manager }
    expect: allow
    expectRowCount: 1
    mustContainText: [陈建国, 采购总监]

  - id: cn14
    title: 销售拉联系人列表只见自己名下 3 人
    category: crm
    system: twenty
    tool: list_contacts
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectRowCount: 3
    mustNotContainFields: [email, phone]
    mustNotContainText: [周涛, 吴芳]

  - id: cr12
    title: 销售按同事的客户过滤联系人拿不到任何行
    category: crm_redteam
    system: twenty
    tool: list_contacts
    args: { account_id: a003 }
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectRowCount: 0
    mustNotContainText: [周涛]

  - id: cb07
    title: account_id 传空字符串 → zod min(1) 报错
    category: crm_boundary
    system: twenty
    tool: list_contacts
    args: { account_id: "" }
    principal: { userId: e005, role: sales_manager }
    expect: error

  # —— 审批闸门（W9）：涉审写操作必须被挂起，免审路径必须畅通 ——

  - id: ca01
    title: 销售删自己名下联系人被闸门挂起（pending 分支无 data）
    category: crm_approval
    system: twenty
    tool: delete_contact
    args: { contact_id: c001 }
    principal: { userId: e007, role: sales_rep }
    expect: pending
    mustNotContainText: [陈建国, huasheng]

  - id: ca02
    title: 销售改商机阶段被闸门挂起
    category: crm_approval
    system: twenty
    tool: update_opportunity_stage
    args: { opportunity_id: o001, stage: Closed Won }
    principal: { userId: e007, role: sales_rep }
    expect: pending

  - id: ca03
    title: 销售新建联系人免审直通，归属自动盖当前身份
    category: crm_approval
    system: twenty
    tool: create_contact
    args: { name: 评测新客 }
    principal: { userId: e007, role: sales_rep }
    expect: allow
    expectDataIncludes: { owner_id: e007, name: 评测新客 }
    mustNotContainFields: [phone]

  - id: ca04
    title: 经理（审批人角色）删除免审直通
    category: crm_approval
    system: twenty
    tool: delete_contact
    args: { contact_id: c004 }
    principal: { userId: e005, role: sales_manager }
    expect: allow
