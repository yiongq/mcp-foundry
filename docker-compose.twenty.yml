# 本地真实 Twenty —— 给「本地对着真 Twenty 测过再部署」用(parity 第②层)。
#
#   docker compose -f docker-compose.twenty.yml up -d      # 起本地 Twenty → http://localhost:3000
#   # 首次进 http://localhost:3000 建工作区 + 拿 API key(Settings → API & Webhooks)
#   # 建自定义对象 Order(name/email/lastFour/amountPaid/repCode),见 docs/twenty-notes.md
#   TWENTY_API_URL=http://localhost:3000 TWENTY_API_KEY=<key> pnpm seed:twenty   # 灌 fixture 数据
#   TWENTY_API_URL=http://localhost:3000 TWENTY_API_KEY=<key> TWENTY_OWNER_FIELD=repCode \
#     pnpm --filter @yiong/foundry-server serve                                  # 网关连本地真 Twenty
#
# ⚠️ 这是「起点」编排,镜像 tag / 环境变量以 Twenty 官方自托管文档为准:
#    https://twenty.com/developers/section/self-hosting/docker-compose
#    维护负担别自己扛——需要时对齐官方 docker-compose 即可。
name: mcp-foundry-twenty

services:
  twenty-server:
    image: twentycrm/twenty:latest
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_started
    environment:
      NODE_PORT: 3000
      SERVER_URL: http://localhost:3000
      PG_DATABASE_URL: postgres://postgres:postgres@twenty-db:5432/default
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      # 本地测试用固定串即可(勿用于生产);生产请用 openssl rand -base64 32 生成并保密
      APP_SECRET: local-dev-only-not-for-production-change-me
    ports:
      - "3000:3000"
    volumes:
      - twenty-server-data:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  twenty-worker:
    image: twentycrm/twenty:latest
    command: ["yarn", "worker:prod"]
    depends_on:
      twenty-server:
        condition: service_healthy
    environment:
      PG_DATABASE_URL: postgres://postgres:postgres@twenty-db:5432/default
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      APP_SECRET: local-dev-only-not-for-production-change-me
    restart: unless-stopped

  twenty-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    volumes:
      - twenty-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "default"]
      interval: 5s
      timeout: 5s
      retries: 10

  twenty-redis:
    image: redis:7

volumes:
  twenty-db-data:
  twenty-server-data:
