name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # 版本取 package.json 的 packageManager 字段
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test
      # 安全内核覆盖率门禁（阈值在 packages/core/vitest.config.ts）——一处未测分支最危险
      - run: pnpm --filter @yiong/foundry-core exec vitest run --coverage

  python-client:
    # LangGraph 客户端此前完全不进 CI——整条框架绑定可能悄悄回归。ruff + pytest 门住它。
    # test_live_gateway.py 未设 FOUNDRY_TEST_LIVE 时自跳过，CI 里不需要外部网关。
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/langgraph
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # fixture 模式：不需要任何密钥/外部系统。
      # 脚本 cwd 是 packages/eval，--out 指回仓库根，供下面的 artifact 上传。
      # --repeat 3 报方差（硬断言轨应为 0）；--ablation 输出守卫逐层开/关四档对照。
      # LLM-judge 软轨需要密钥不进 CI；校准与双轨在本地跑（见 docs/eval-methodology.md）。
      - run: >-
          pnpm --filter @yiong/foundry-eval run eval
          --out ../../eval-reports/report.md --repeat 3 --ablation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-reports/report.md
          if-no-files-found: error

  # 容器构建：PR 只构建（抓 Dockerfile 回归）；push 到 main 额外推送带 SHA 摘要标签的镜像到
  # GHCR，于是部署可「按摘要拉取 CI 验证过的那一版」，而不是在 VPS 上从源码现建（部署物 = 测试物）。
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR (push to main only)
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (+push on main) foundry-server
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcp-foundry-server:latest
            ghcr.io/${{ github.repository_owner }}/mcp-foundry-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build (+push on main) langgraph-client
        uses: docker/build-push-action@v6
        with:
          context: clients/langgraph
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/foundry-langgraph-client:latest
            ghcr.io/${{ github.repository_owner }}/foundry-langgraph-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 自动部署（CD）：push 到 main、全部质量门 + 镜像推送都过后，SSH 进 VPS 拉这次构建的
  # 确切镜像（按 SHA，可复现/可回滚）重启并冒烟。合并即上线，人不用碰服务器。
  # 需要仓库密钥：VPS_SSH_KEY（部署专用 SSH 私钥）、VPS_HOST（服务器 IP）。
  deploy:
    if: github.event_name == 'push'
    needs: [checks, python-client, eval-gate, docker]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to VPS over SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true
          # 非 root 部署：登录专用 deploy 用户（docker 组，无 root SSH），密钥禁 PTY/转发。
          SSHOPT="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          DEST="deploy@${{ secrets.VPS_HOST }}"
          # 镜像里已含 packages/* 与 config/rbac；这里补齐运行时需要但不在镜像里的：compose 文件
          # （GHCR image 引用——旧 VPS compose 指的是本地镜像，不同步就永远拉不到新镜像）、landing
          # 静态页、config/Caddyfile。严格排除 .env / 审计 / 飞书身份，绝不覆盖服务器侧密钥与数据。
          # -rlptz（非 -a）：不保留 owner/group（deploy 无权 chown，文件自然归 deploy）。
          rsync -rlptz -e "$SSHOPT" \
            --exclude node_modules --exclude .git --exclude .env \
            --exclude '.venv' --exclude '__pycache__' --exclude '*.pyc' \
            --exclude 'audit/*.jsonl' --exclude eval-reports \
            --exclude config/identity.feishu.yaml \
            ./ "$DEST":/opt/mcp-foundry/
          $SSHOPT "$DEST" 'bash -s' <<'DEPLOY'
          set -euo pipefail
          export FOUNDRY_IMAGE_TAG=${{ github.sha }}
          # 幂等保障：审计卷归非 root 容器（uid 10001）所有，免得首次非 root 部署写审计 EACCES
          docker run --rm -v mcp-foundry_foundry-audit:/audit alpine chown -R 10001:10001 /audit >/dev/null 2>&1 || true
          cd /opt/mcp-foundry && docker compose pull && docker compose up -d --remove-orphans
          cd clients/langgraph && docker compose pull && docker compose up -d
          for i in $(seq 1 20); do curl -fsS -m 5 http://127.0.0.1:3100/healthz >/dev/null && break; sleep 2; done
          curl -fsS -m 10 http://127.0.0.1:3100/healthz >/dev/null && echo "OK gateway healthz"
          # 升级真验证：/readyz 是硬化栈才有的端点——200 才证明新镜像真在跑（不是旧容器蒙混）
          rc=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/readyz)
          test "$rc" = "200" && echo "OK /readyz 200 (new hardened image live)" || { echo "FAIL /readyz -> $rc (old image still running?)"; exit 1; }
          code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3100/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -H 'x-foundry-user: e004' -H 'x-foundry-role: hr_admin' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          test "$code" = "401" && echo "OK forged header -> 401 (signed mode enforced)" || { echo "FAIL forged header -> $code (want 401)"; exit 1; }
          curl -fsS -m 10 http://127.0.0.1:8100/api/config >/dev/null && echo "OK langgraph"
          echo "deployed ${{ github.sha }}"
          DEPLOY
