name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4 # 版本取 package.json 的 packageManager 字段
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm -r test

  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # fixture 模式：不需要任何密钥/外部系统。
      # 脚本 cwd 是 packages/eval，--out 指回仓库根，供下面的 artifact 上传。
      # --repeat 3 报方差（硬断言轨应为 0）；--ablation 输出守卫逐层开/关四档对照。
      # LLM-judge 软轨需要密钥不进 CI；校准与双轨在本地跑（见 docs/eval-methodology.md）。
      - run: >-
          pnpm --filter @yiong/foundry-eval run eval
          --out ../../eval-reports/report.md --repeat 3 --ablation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval-reports/report.md
          if-no-files-found: error
