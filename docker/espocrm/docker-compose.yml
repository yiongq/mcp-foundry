# EspoCRM 演示环境（官方镜像支持环境变量自动安装，无需 Web 向导）。
# 只读 MySQL 模式联调用的真实 EspoCRM。演示与 CI 默认走 fixture 模式，不依赖本目录。
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: espocrm_root
      MYSQL_DATABASE: espocrm
      MYSQL_USER: espocrm
      MYSQL_PASSWORD: espocrm_pw
    ports:
      # 只读 MySQL 适配器从宿主直连（foundry_ro，SELECT-only）；
      # 3307 已被 docker/orangehrm 占用，这里用 3308，同样只绑 127.0.0.1
      - "127.0.0.1:3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pespocrm_root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  espocrm:
    image: espocrm/espocrm:9
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: mysql
      ESPOCRM_DATABASE_PORT: "3306"
      ESPOCRM_DATABASE_NAME: espocrm
      ESPOCRM_DATABASE_USER: espocrm
      ESPOCRM_DATABASE_PASSWORD: espocrm_pw
      ESPOCRM_ADMIN_USERNAME: admin
      ESPOCRM_ADMIN_PASSWORD: Foundry@2026
      ESPOCRM_SITE_URL: http://127.0.0.1:8072
    ports:
      # 8071 已被 docker/orangehrm 占用，这里用 8072；演示环境不对外暴露
      - "127.0.0.1:8072:80"
    volumes:
      - espocrm_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  mysql_data:
  espocrm_data:
