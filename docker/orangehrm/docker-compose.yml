# OrangeHRM Starter 5.x 演示环境（首次启动需走 Web 安装向导，见同目录 README.md）
services:
  mysql:
    image: mysql:8.0
    # OrangeHRM 的 PHP 驱动对 caching_sha2_password 的兼容性没实测过，
    # 演示环境直接退回 mysql_native_password 省事（8.4 起该参数被移除，故镜像钉在 8.0）
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: orangehrm_root
      MYSQL_DATABASE: orangehrm
      MYSQL_USER: orangehrm
      MYSQL_PASSWORD: orangehrm_pw
    ports:
      # 只读 MySQL 适配器从宿主直连（foundry_ro，SELECT-only）；同 8071 的理由绑 127.0.0.1
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -porangehrm_root --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  orangehrm:
    image: orangehrm/orangehrm:5.7
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # 显式绑 127.0.0.1:8071——8080/8090 会被 ai-edge 网关的 dual-stack 监听盖住，
      # 且演示环境不必对外暴露
      - "127.0.0.1:8071:80"
    volumes:
      # 整个 web 目录进卷：安装向导写入的 DB 配置（lib/confs/Conf.php）才能跨容器重建保留。
      # 代价是镜像升级不会自动生效——演示环境接受这个取舍。
      - orangehrm_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  mysql_data:
  orangehrm_data:
