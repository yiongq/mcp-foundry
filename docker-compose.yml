# ── foundry 公网栈（模式照搬 ai-edge：只绑 loopback，Caddy 在最前）──────────
#   cp .env.production.example .env    # 填 FOUNDRY_IDENTITY_SECRET（服务器侧，绝不 commit）
#   docker compose up --build -d
#   BASE=http://127.0.0.1:3100 bash smoke.sh
#
# 端口只发布到 127.0.0.1——公网流量必须经 Caddy（HTTPS + 域名）进来：
#   foundry.yiongspace.com { reverse_proxy 127.0.0.1:3100 }

name: mcp-foundry

services:
  foundry-server:
    # image 指向 CI 构建并推到 GHCR 的镜像；build 保留作本地/离线兜底。
    #   deploy-by-digest（推荐）：docker compose pull && up -d —— 跑 CI 验过的那版（部署物 = 测试物）
    #   钉版本 / 回滚：FOUNDRY_IMAGE_TAG=<git sha> docker compose up -d（缺省 latest = 最新 main）
    #   仍想本机现建：docker compose up --build -d
    build: .
    image: ghcr.io/yiongq/mcp-foundry-server:${FOUNDRY_IMAGE_TAG:-latest}
    environment:
      PORT: "3100"
      # 生产铁律：必须设签名身份。缺失时 serve 直接拒绝启动（fail-closed，不再落回头模式）；
      # :? 再加一道——.env 没填这个连 compose 都起不来。smoke.sh 的"伪造头必须 401"探针兜底。
      FOUNDRY_IDENTITY_SECRET: "${FOUNDRY_IDENTITY_SECRET:?set in .env — never commit}"
      # 可选：设了即切 token-jwks（ES256/RS256）。http(s):// 走 URL 定时拉取，
      # 否则按容器内文件路径。与 SECRET 同设时 JWKS 生效（HS256 令牌作废）——
      # SECRET 仍保留 :? 强制，作为"绝不落回 demo 头模式"的兜底闸。
      FOUNDRY_IDENTITY_JWKS: "${FOUNDRY_IDENTITY_JWKS:-}"
      FOUNDRY_IDENTITY_JWKS_REFRESH: "${FOUNDRY_IDENTITY_JWKS_REFRESH:-}"
      FOUNDRY_IDENTITY_JWKS_MAX_STALE: "${FOUNDRY_IDENTITY_JWKS_MAX_STALE:-}"
      # CRM 域走 Twenty。设了 TWENTY_API_* 即连真库 REST（Bearer），否则 fixture 演示数据。
      TWENTY_API_URL: "${TWENTY_API_URL:-}"
      TWENTY_API_KEY: "${TWENTY_API_KEY:-}"
      TWENTY_OWNER_FIELD: "${TWENTY_OWNER_FIELD:-}"
    # 让容器能通过 host.docker.internal 访问宿主机发布的服务
    # （如 Twenty 后端 REST：TWENTY_API_URL=http://host.docker.internal:3200）。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - "foundry-audit:/app/audit"
    restart: unless-stopped
    # 资源上限：单容器泄漏/被打不至于拖垮整机（同机还跑 Twenty 与别的栈）。
    mem_limit: 512m
    cpus: 1.0
    # 纵深加固：容器内进程不再需要新增能力（镜像已非 root + tini）。
    security_opt:
      - no-new-privileges:true
    # 日志轮转：stdout（含结构化 JSON 访问日志）不无限增长撑爆磁盘。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  foundry-audit:
