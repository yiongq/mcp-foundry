<!doctype html>
<html lang="zh" data-theme="light" data-accent="sage">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foundry · LangGraph 客户端</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%236e8c6a'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='20' font-weight='700' fill='%23fff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E"
    />
    <style>
      @font-face { font-family: "Geist"; src: url("/assets/fonts/Geist-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
      @font-face { font-family: "Geist"; src: url("/assets/fonts/Geist-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
      @font-face { font-family: "Geist"; src: url("/assets/fonts/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
      @font-face { font-family: "Geist Mono"; src: url("/assets/fonts/GeistMono-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }

      :root {
        --font-sans: "Geist", "PingFang SC", "Microsoft YaHei", sans-serif;
        --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, monospace;
        --bg-base: #faf9f5; --bg-panel: #fdfcf8; --bg-elev: #f0eee6; --bg-sunken: #e9e6dc;
        --border: #e4e0d5; --border-strong: #d0cbbd; --border-subtle: #efece3;
        --fg: #262420; --fg-strong: #161512; --fg-muted: #6e6a60; --fg-faint: #8a857a; --fg-on-accent: #fff;
        --success: #58745f; --success-soft: #e7ede6; --warning: #84601f; --warning-soft: #f4ecda; --warning-border: #e0d3ac; --danger: #ab4439; --danger-soft: #f6e7e4;
        --accent: #6e8c6a; --accent-hover: #5c7a58; --accent-soft: #e8eee4; --accent-soft-border: #c6d4c0; --accent-text: #46603f;
        --shadow-sm: 0 1px 2px rgba(26,24,23,.05), 0 1px 1px rgba(26,24,23,.03);
        --shadow-lg: 0 12px 32px rgba(26,24,23,.12), 0 2px 8px rgba(26,24,23,.06);
        --duration: 180ms; --ease: cubic-bezier(0.16, 1, 0.3, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg-base: #1f1e1b; --bg-panel: #262624; --bg-elev: #30302d; --bg-sunken: #191815;
          --border: #3a3935; --border-strong: #4c4a44; --border-subtle: #2e2d2a;
          --fg: #ece9e1; --fg-strong: #faf9f5; --fg-muted: #a6a196; --fg-faint: #928d83; --fg-on-accent: #fff;
          --success: #8fae93; --success-soft: #27302a; --warning: #cfa45e; --warning-soft: #2e2819; --warning-border: #4c3f22; --danger: #d97a7a; --danger-soft: #2e211f;
          --accent: #8fae8a; --accent-hover: #7e9d79; --accent-soft: #242c21; --accent-soft-border: #3c4a38; --accent-text: #b5cdb0;
          --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
        }
      }
      :root[data-theme="dark"] {
        --bg-base: #1f1e1b; --bg-panel: #262624; --bg-elev: #30302d; --bg-sunken: #191815;
        --border: #3a3935; --border-strong: #4c4a44; --border-subtle: #2e2d2a;
        --fg: #ece9e1; --fg-strong: #faf9f5; --fg-muted: #a6a196; --fg-faint: #928d83; --fg-on-accent: #fff;
        --success: #8fae93; --success-soft: #27302a; --warning: #cfa45e; --warning-soft: #2e2819; --warning-border: #4c3f22; --danger: #d97a7a; --danger-soft: #2e211f;
        --accent: #8fae8a; --accent-hover: #7e9d79; --accent-soft: #242c21; --accent-soft-border: #3c4a38; --accent-text: #b5cdb0;
        --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--bg-base); color: var(--fg);
        font-family: var(--font-sans); font-size: 15px; line-height: 1.7;
        font-feature-settings: "ss01", "cv11"; -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column; height: 100dvh;
      }
      button, input, textarea { font-family: inherit; }
      :where(button, textarea, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
      @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

      header {
        border-bottom: 1px solid var(--border-subtle); background: var(--bg-panel);
        padding: 13px 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      }
      .brand { font-weight: 600; color: var(--fg-strong); letter-spacing: -.01em; }
      .brand .mono { font-family: var(--font-mono); font-size: 12px; color: var(--accent-text); font-weight: 400; margin-left: 8px; padding: 2px 7px; background: var(--accent-soft); border: 1px solid var(--accent-soft-border); border-radius: 5px; }
      .meta { margin-left: auto; display: flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-faint); flex-wrap: wrap; }
      .chip { padding: 3px 9px; border: 1px solid var(--border); border-radius: 20px; background: var(--bg-base); white-space: nowrap; }
      .icon-btn { border: 1px solid var(--border); background: var(--bg-base); border-radius: 6px; cursor: pointer; color: var(--fg-muted); width: 30px; height: 30px; font-size: 14px; }
      .icon-btn:hover { background: var(--bg-elev); color: var(--fg); }

      main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
      .thread { max-width: 760px; margin: 0 auto; padding: 26px 20px 8px; display: flex; flex-direction: column; gap: 18px; }

      .msg { animation: msgIn var(--duration) var(--ease); }
      .msg .who { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-faint); margin-bottom: 6px; }
      .msg.user .bubble { background: var(--accent-soft); border: 1px solid var(--accent-soft-border); color: var(--fg-strong); border-radius: 12px 12px 4px 12px; padding: 11px 15px; margin-left: auto; max-width: 82%; width: fit-content; }
      .msg.user { display: flex; flex-direction: column; align-items: flex-end; }
      .msg.ai .bubble { color: var(--fg); white-space: pre-wrap; word-break: break-word; }
      .msg.ai .bubble p { margin: 0 0 10px; }
      .msg.ai .bubble p:last-child { margin-bottom: 0; }
      .msg.ai .bubble strong { color: var(--fg-strong); font-weight: 600; }
      .msg.ai .bubble code { font-family: var(--font-mono); font-size: .88em; background: var(--bg-elev); padding: 1px 5px; border-radius: 4px; }
      .tbl-wrap { overflow-x: auto; margin: 4px 0 10px; }
      .msg.ai .bubble table { border-collapse: collapse; font-size: 13.5px; white-space: normal; }
      .msg.ai .bubble th, .msg.ai .bubble td { border: 1px solid var(--border); padding: 7px 12px; text-align: left; }
      .msg.ai .bubble th { background: var(--bg-elev); color: var(--fg-strong); font-weight: 600; }
      .bubble a { color: var(--accent-text); }
      .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: text-bottom; margin-left: 1px; animation: blink 1s steps(1) infinite; border-radius: 1px; }

      .tools { display: flex; flex-direction: column; gap: 6px; margin: 4px 0 2px; }
      .tool-row { font-family: var(--font-mono); font-size: 12px; color: var(--fg-muted); display: flex; align-items: center; gap: 8px; }
      .tool-row .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--fg-faint); flex: none; }
      .tool-row.ok .dot { background: var(--success); }
      .tool-row.refusal .dot, .tool-row.error .dot { background: var(--danger); }
      .tool-row.running .dot { background: var(--warning); animation: blink 1s infinite; }
      .tool-row .verdict { color: var(--fg-faint); }

      .approval { border: 1px solid var(--warning-border); background: var(--warning-soft); border-radius: 12px; padding: 15px 16px; margin: 6px 0; box-shadow: var(--shadow-sm); }
      .approval .head { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--fg-strong); margin-bottom: 4px; }
      .approval .sub { font-family: var(--font-mono); font-size: 11.5px; color: var(--fg-muted); margin-bottom: 12px; }
      .approval .actions { display: flex; gap: 9px; }
      .approval.decided { background: var(--bg-panel); border-color: var(--border); }
      .approval.approved .head { color: var(--success); }
      .approval.denied .head { color: var(--danger); }
      .btn { border: 1px solid var(--border-strong); background: var(--bg-panel); color: var(--fg); border-radius: 7px; padding: 7px 15px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 140ms var(--ease); }
      .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
      .btn.approve { background: var(--accent); border-color: var(--accent); color: var(--fg-on-accent); }
      .btn.approve:hover { background: var(--accent-hover); }
      .btn.deny:hover { border-color: var(--danger); color: var(--danger); }
      .btn:disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }

      .empty { max-width: 760px; margin: 8vh auto 0; padding: 0 20px; text-align: center; color: var(--fg-muted); }
      .empty h1 { font-size: clamp(24px, 4vw, 32px); font-weight: 600; color: var(--fg-strong); letter-spacing: -.02em; margin: 0 0 10px; }
      .empty p { max-width: 480px; margin: 0 auto 26px; }
      .prompts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 560px; margin: 0 auto; }
      .prompts button { text-align: left; border: 1px solid var(--border); background: var(--bg-panel); border-radius: 10px; padding: 13px 15px; cursor: pointer; color: var(--fg); font-size: 13.5px; line-height: 1.5; transition: all 140ms var(--ease); }
      .prompts button:hover { border-color: var(--accent-soft-border); background: var(--accent-soft); transform: translateY(-1px); }
      .prompts .tag { font-family: var(--font-mono); font-size: 10px; color: var(--fg-faint); text-transform: uppercase; letter-spacing: .05em; display: block; margin-bottom: 4px; }
      @media (max-width: 560px) { .prompts { grid-template-columns: 1fr; } }

      footer { border-top: 1px solid var(--border-subtle); background: var(--bg-panel); padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); }
      .composer { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
      .composer textarea { flex: 1; resize: none; border: 1px solid var(--border-strong); background: var(--bg-base); color: var(--fg); border-radius: 12px; padding: 12px 14px; font-size: 15px; line-height: 1.5; max-height: 160px; }
      .composer textarea::placeholder { color: var(--fg-faint); }
      .send { border: 0; background: var(--accent); color: var(--fg-on-accent); border-radius: 12px; width: 46px; height: 46px; font-size: 18px; cursor: pointer; flex: none; transition: all 140ms var(--ease); }
      .send:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
      .send:disabled { opacity: .45; cursor: default; }
      .hint { max-width: 760px; margin: 8px auto 0; font-size: 11px; color: var(--fg-faint); text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">Foundry<span class="mono">LangGraph</span></div>
      <div class="meta" id="meta">
        <span class="chip" id="chip-identity">身份 …</span>
        <span class="chip" id="chip-model">模型 …</span>
        <button class="icon-btn" id="theme" title="切换主题" aria-label="切换主题">◐</button>
      </div>
    </header>

    <main id="main">
      <div class="empty" id="empty">
        <h1>销售数据助手</h1>
        <p>用一句话查改你的 CRM。改/删这类高危操作会被网关闸门挂起，等审批通过再执行——本页可就地批复。</p>
        <div class="prompts" id="prompts">
          <button data-q="哪些客户在苏州？各自的联系人是谁"><span class="tag">查询</span>哪些客户在苏州？联系人是谁</button>
          <button data-q="华胜精密制造的商机金额和阶段"><span class="tag">查询</span>华胜的商机金额和阶段</button>
          <button data-q="把陈建国的职务改成采购副总裁"><span class="tag">高危写 · 需审批</span>把陈建国的职务改成采购副总裁</button>
          <button data-q="删除刘敏这个联系人"><span class="tag">高危写 · 需审批</span>删除刘敏这个联系人</button>
        </div>
      </div>
      <div class="thread" id="thread" hidden></div>
    </main>

    <footer>
      <form class="composer" id="composer">
        <textarea id="input" rows="1" placeholder="问点什么，或让我改改数据…" autocomplete="off"></textarea>
        <button class="send" id="send" type="submit" aria-label="发送">↑</button>
      </form>
      <div class="hint" id="hint">连的是同一个 Foundry 网关 · 权限/审批全在网关执行 · 本客户端不做任何策略</div>
    </footer>

    <script src="/assets/app.js"></script>
  </body>
</html>
