# LangGraph 前端的独立部署（与网关同机，直连宿主机 127.0.0.1:3100 网关）。
# network_mode host：容器共享宿主网络——既能连网关 loopback，自身也把 8100 绑在
# 宿主 loopback 上，Caddy 直接 reverse_proxy 127.0.0.1:8100。
# .env（含令牌与 GLM key）由 env_file 注入，不进镜像（.dockerignore 已排除）。
name: foundry-langgraph
services:
  langgraph-client:
    # 同网关：image 指向 GHCR（CI 构建），build 作本地兜底。
    # deploy-by-digest：docker compose pull && up -d；钉版本：FOUNDRY_IMAGE_TAG=<sha>。
    build: .
    image: ghcr.io/yiongq/foundry-langgraph-client:${FOUNDRY_IMAGE_TAG:-latest}
    network_mode: host
    env_file: .env
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
